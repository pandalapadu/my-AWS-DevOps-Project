- name: Discussion on Error handling in Ansible
  hosts: frontend
  become: yes
  tasks:
    - name: checking roboshop user exist or not
      command: id roboshop
      register: roboshop_user_output
      ignore_errors: true
    - name: print user output
      debug:
        msg: " {{ roboshop_user_output }}"
    - name: creating roboshop user
      command: useradd roboshop
      when: roboshop_user_output.rc != 0
