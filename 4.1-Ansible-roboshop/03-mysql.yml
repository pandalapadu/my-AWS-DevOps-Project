- name: Configuring mysql configuration
  hosts: mysql
  become: yes
  tasks:
    - name: Install MySQL server
      package:
        name: mysql-server
        state: present
    - name: start and enabled MySQL server
      service:
        state: started
        enabled: yes
        name: mysqld
    - name: setup root password
      command: mysql_secure_installation --set-root-pass 'RoboShop@1'