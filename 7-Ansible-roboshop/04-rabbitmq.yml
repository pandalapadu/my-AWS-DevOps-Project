- name: Configuring rabbitmq configuration
  hosts: rabbitmq
  become: yes
  tasks: 
    - name: copy rabbitmq repo file
      copy:
        src: rabbitmq.repo
        dest: /etc/yum.repos.d/rabbitmq.repo
    - name: install rabbitmq server
      package:
        name: rabbitmq-server
        state: present
    - name: start and enabled rabbitmq server
      service:
        state: started
        enabled: yes
        name: rabbitmq-server
    - name: create roboshop MQ User
      community.rabbitmq.rabbitmq_user:
        user: roboshop
        password: "roboshop123"
        state: present
        permissions:
          - vhost: /
            configure_priv: ".*"
            write_priv: ".*"
            read_priv: ".*"
            