# eksctl create cluster --config-file=eksctl.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: roboshop
  region: us-east-1
autoModeConfig:
  enabled: false
managedNodeGroups:
  - name: managed
    instanceTypes:
      - t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    spot: true