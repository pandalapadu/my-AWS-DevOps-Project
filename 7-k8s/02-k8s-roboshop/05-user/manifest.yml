apiVersion: v1
kind: ConfigMap
metadata:
  name: user
  namespace: roboshop
  labels:
    project: roboshop
    tier: user
    component: user
data:
  MONGO: "true"
  REDIS_URL: 'redis://redis:6379'
  MONGO_URL: "mongodb://mongodb:27017/users"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: roboshop
  labels:
    project: roboshop
    tier: user
    component: user
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      tier: user
      component: user
  template:
    metadata:
      labels:
        project: roboshop
        tier: user
        component: user
    spec:
      containers:
      - name: user
        image: pandalapadu/user:4.0.0
        envFrom:
        - configMapRef:
            name: user
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: roboshop
  labels:
    project: roboshop
    tier: user
    component: user
spec:
  selector:
    project: roboshop
    tier: user
    component: user