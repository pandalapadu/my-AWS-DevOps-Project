apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com # Connects to the AWS EFS CSI Driver
parameters:
  provisioningMode: efs-ap   # Essential: Instructs the driver to provision using EFS Access Points
  fileSystemId: fs-0123456789abcdef0 # ⚠️ Replace with your pre-created EFS ID
  directoryPerms: "700"      # POSIX permissions for the dynamically created directory
  
  # Optional advanced configurations:
  gidRangeStart: "1000"      # Optional: Start range for automatic POSIX group assignments
  gidRangeEnd: "2000"        # Optional: End range for automatic POSIX group assignments
  basePath: "/roboshop"       # Optional: Root folder under which all dynamic PV directories are created
