apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-dynamic
spec:
  accessModes:
    - ReadWriteMany # Allows shared concurrent access by multiple pods
  storageClassName: efs-sc # Targets the dynamic StorageClass
  resources:
    requests:
      storage: 10Gi # Required by K8s syntax, but EFS auto-scales infinitely
---
apiVersion: v1
kind: Pod
metadata:
  name: efs-dynamic
spec:
  containers:
    - name: nginx
      image: nginx
      volumeMounts:
        - name: persistent-storage
          mountPath: /data # Mounts the dynamically provisioned EFS directory to this path inside the container
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: efs-dynamic
