apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: roboshop     # The namespace where this role applies
  name: devops-tls    # like this this is roboshop admin
rules:
- apiGroups: ["*"]         # The core/empty API group for Pods, Services, ConfigMaps, etc.
  resources: ["*"]
  verbs: ["*"] # All the access for this role 
