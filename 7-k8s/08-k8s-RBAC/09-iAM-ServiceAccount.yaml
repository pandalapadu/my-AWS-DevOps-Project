##IRSA (IAM Roles for Service Accounts). 
#It uses the OIDC provider you just configured to give your application pods secure access to AWS resources (like S3, EFS, or Secrets Manager) without using hardcoded access keys.
eksctl create iamserviceaccount \
  --name roboshop-secret-reader-sa \
  --namespace roboshop \
  --cluster roboshop \
  --region us-east-1 \
  --attach-policy-arn arn:aws:iam::453388807064:policy/robshop-mySQL-SecretReader \
  --approve
## it will create iam service account with given policy 
#for view above EKS CTL command using 
#  kubectl get sa roboshop-secret-reader-sa -n roboshop -o yaml

