apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-1
  namespace: roboshop
  # labels related to deployment resource
  labels:
    app: app-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-1
  # Pod
  template:
    metadata:
      labels:
        app: app-1
    spec:
      containers:
      - name: app-1
        image: pandalapadu/app1:1.0
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-1
  namespace: roboshop
  # servicer labels
  labels:
    app: app-1
spec:
  # Service uses the below labels to select the pods
  selector:
    app: app-1
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80 # container port
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: app-1
  namespace: roboshop
spec:
  serviceRef:
    name: app-1 # route traffic to the awesome-service
    port: 80
  targetGroupARN: arn:aws:elasticloadbalancing:us-east-1:453388807064:targetgroup/roboshop-dev-frontend/b7f623a384fb3ee0
  targetType: ip
  ###to get TargetGroup ARN value use below commands 
  # aws elbv2 describe-target-groups \
  # --region us-east-1 \
  # --query 'TargetGroups[*].[TargetGroupName,TargetGroupArn,TargetType,Port,Protocol]' \
  # --output table