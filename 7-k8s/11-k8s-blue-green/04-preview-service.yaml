## for switchin svc : kubectl patch svc nginx -p '{"spec":{"selector":{"version":"green"}}}'
## if no traffic we will make it 0 --> kubectl patch deployment nginx-blue -p '{"spec":{"replicas":0}}'
apiVersion: v1
kind: Service
metadata:
  name: nginx-preview
  # servicer labels
  # labels:
  #   app: nginx
  #   version: blue
spec:
  type: LoadBalancer
  # Service uses the below labels to select the pods
  selector:
    app: nginx
    version: green
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80 # container port