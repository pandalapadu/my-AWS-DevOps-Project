- name: get the password from the AWS Secret Manager
  debug: 
    msg: "lookup('amazon.aws.aws_secret', 'roboshop/mysql_root_password', region='us-east-1')"
- name: install mysql server
  package:
    name: mysql-server
    state: present
- name: start and enable mysql server
  service:
    state: started
    enabled: yes
    name: mysqld
- name: setup root password
  #command: mysql_secure_installation --set-root-pass "{{ MYSQL_ROOT_PASSWORD }}"
  command: mysql_secure_installation --set-root-pass "{{ MYSQL_ROOT_PASSWORD }}"