# =====================================================
# Required Project Identification
# =====================================================
# Unique identifier across your SonarQube instance
sonar.projectKey=roboshop-catalogue

# Display name in the SonarQube UI
sonar.projectName=RoboShop Catalogue

# Fallback project version (can be overridden dynamically in Jenkins)
sonar.projectVersion=1.0.0

# =====================================================
# Source Code Configuration
# =====================================================
# Path to source directories relative to this file
sonar.sources=.

# Source files encoding
sonar.sourceEncoding=UTF-8

# =====================================================
# Exclusions (Critical for Node.js projects)
# =====================================================
# Exclude third-party packages, logs, and artifacts from analysis
sonar.exclusions=node_modules/**, \
                 coverage/**, \
                 dist/**, \
                 build/**, \
                 **/*.spec.js, \
                 **/*.test.js, \
                 .git/**, \
                 Jenkinsfile, \
                 Dockerfile


# =====================================================
# Tests and Coverage (Uncomment if tests are present)
# =====================================================
sonar.tests=testing
sonar.test.inclusions=**/*.test.js,**/*.spec.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info